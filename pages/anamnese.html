<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>BJJ Performance Pro · Anamnese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Tokens (Modo Clean) ───────────────────────── */
    :root {
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --bg-muted: #f5f5f5;
      --border: #e5e7eb;
      --border-soft: #f3f4f6;
      --border-strong: #d1d5db;

      --text: #0f172a;
      --text-soft: #64748b;
      --text-muted: #94a3b8;

      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-soft: #fef2f2;
      --primary-text: #991b1b;

      --success: #10b981;
      --success-soft: #ecfdf5;
      --success-text: #065f46;

      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --warning-text: #92400e;

      --info: #3b82f6;
      --info-soft: #eff6ff;
      --info-text: #1e40af;

      --error: #dc2626;
      --error-soft: #fef2f2;
      --error-text: #991b1b;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    /* ─── Reset ───────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
    }
    h1, h2, h3, p { margin: 0; }
    button { cursor: pointer; }
    a { color: inherit; }

    /* ─── App container ───────────────────────── */
    #app {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* ─── Tela de boas-vindas ───────────────────────── */
    .fp-welcome {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 24px;
    }
    .fp-welcome-card {
      width: 100%;
      max-width: 640px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      box-shadow: var(--shadow-md);
      text-align: left;
    }
    .fp-welcome-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 18px;
    }
    .fp-welcome-title {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }
    .fp-welcome-body {
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
    }
    .fp-welcome-body p {
      margin-bottom: 18px;
    }
    .fp-welcome-body strong {
      color: var(--text);
      font-weight: 600;
    }
    .fp-welcome-cta-line {
      font-weight: 600;
      color: var(--text);
      margin-top: 8px !important;
      margin-bottom: 32px !important;
    }
    .fp-welcome-meta {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ─── Header do formulário ───────────────────────── */
    .fp-header {
      text-align: center;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 24px;
    }
    .fp-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .fp-title {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .fp-subtitle {
      font-size: 13px;
      color: var(--text-soft);
    }

    /* ─── Barra de progresso ───────────────────────── */
    .fp-progress-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .fp-progress-track {
      flex: 1;
      height: 6px;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
    }
    .fp-progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fp-progress-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* ─── Card de bloco ───────────────────────── */
    .fp-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }
    .fp-block-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 8px;
    }
    .fp-block-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
    }
    .fp-block-meta { flex: 1; }
    .fp-block-meta h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .fp-block-sub {
      font-size: 13px;
      color: var(--text-soft);
      margin-top: 4px;
      font-weight: 500;
    }
    .fp-block-intro {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.6;
      margin: 12px 0 0;
      padding: 14px 16px;
      background: var(--bg-soft);
      border-radius: var(--radius);
      border-left: 3px solid var(--primary);
    }

    /* ─── Campos ───────────────────────── */
    .fp-fields {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .fp-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fp-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.005em;
      line-height: 1.45;
    }
    .fp-help {
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-top: -4px;
    }
    .fp-input,
    .fp-textarea {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .fp-input:hover,
    .fp-textarea:hover {
      border-color: var(--text-muted);
    }
    .fp-input:focus,
    .fp-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }
    .fp-input::placeholder,
    .fp-textarea::placeholder { color: var(--text-muted); }
    .fp-textarea {
      resize: vertical;
      min-height: 96px;
      font-family: inherit;
    }

    /* ─── Radio groups ───────────────────────── */
    .fp-radio-group,
    .fp-checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fp-radio,
    .fp-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      font-size: 15px;
      color: var(--text);
      line-height: 1.45;
    }
    .fp-radio:hover,
    .fp-checkbox:hover {
      border-color: var(--text-muted);
      background: var(--bg-soft);
    }
    .fp-radio input[type="radio"],
    .fp-checkbox input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .fp-radio:has(input:checked),
    .fp-checkbox:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .fp-radio span,
    .fp-checkbox span {
      flex: 1;
    }

    /* ─── Checkbox de aceite (consentimento) ───────────────────────── */
    .fp-checkbox-aceite {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
    }
    .fp-checkbox-aceite:hover {
      border-color: var(--text-muted);
    }
    .fp-checkbox-aceite input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .fp-checkbox-aceite:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* ─── Botões ───────────────────────── */
    .fp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.005em;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      white-space: nowrap;
      text-decoration: none;
    }
    .fp-btn:active { transform: translateY(1px); }
    .fp-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .fp-btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .fp-btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .fp-btn-ghost {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .fp-btn-ghost:hover:not(:disabled) {
      background: var(--bg-soft);
      border-color: var(--text-muted);
    }
    .fp-btn-lg {
      padding: 14px 28px;
      font-size: 15px;
      width: 100%;
    }

    /* ─── Navegação entre blocos ───────────────────────── */
    .fp-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border-soft);
    }

    /* ─── Telas de gate / sucesso / erro ───────────────────────── */
    .fp-gate {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 24px;
    }
    .fp-gate-card {
      width: 100%;
      max-width: 600px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .fp-gate-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .fp-gate-warning .fp-gate-icon {
      background: var(--warning-soft);
      color: var(--warning-text);
    }
    .fp-gate-info .fp-gate-icon {
      background: var(--info-soft);
      color: var(--info-text);
    }
    .fp-gate-success .fp-gate-icon {
      background: var(--success-soft);
      color: var(--success-text);
    }
    .fp-gate-error .fp-gate-icon {
      background: var(--error-soft);
      color: var(--error-text);
    }
    .fp-gate-title {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .fp-gate-body {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      text-align: left;
    }
    .fp-gate-body p { margin-bottom: 14px; }
    .fp-gate-body p:last-child { margin-bottom: 0; }
    .fp-gate-soft {
      font-size: 13px;
      color: var(--text-soft);
    }
    .fp-gate-list {
      list-style: none;
      padding: 16px 20px;
      margin: 6px 0 14px;
      background: var(--warning-soft);
      border-radius: var(--radius);
      border-left: 3px solid var(--warning);
      color: var(--warning-text);
      font-size: 14px;
    }
    .fp-gate-list li {
      padding: 4px 0 4px 18px;
      position: relative;
    }
    .fp-gate-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      font-weight: 700;
    }
    .fp-gate-actions {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 540px) {
      .fp-gate-actions {
        flex-direction: row;
        justify-content: center;
      }
      .fp-gate-actions .fp-btn { flex: 1; }
    }

    /* ─── Mobile ───────────────────────── */
    @media (max-width: 600px) {
      #app { padding: 20px 14px 60px; }
      .fp-card { padding: 24px 20px; }
      .fp-welcome-card { padding: 32px 24px; }
      .fp-gate-card { padding: 32px 24px; }
      .fp-block-meta h2 { font-size: 19px; }
      .fp-fields { gap: 22px; }
      .fp-nav {
        flex-direction: column-reverse;
        gap: 8px;
      }
      .fp-nav .fp-btn { width: 100%; }
    }

    /* ─── Footer discreto ───────────────────────── */
    .fp-footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="fp-welcome">
      <div class="fp-welcome-card">
        <p class="fp-welcome-tag">Carregando</p>
        <h1 class="fp-welcome-title">Preparando sua anamnese...</h1>
        <p class="fp-welcome-body">Aguarde um instante.</p>
      </div>
    </div>
  </div>

  <footer class="fp-footer">
    BJJ Performance Pro · Prof. Fontes Júnior · CREF 005654-G/AM
  </footer>

  <script type="module" src="./assets/form-logic.js"></script>
</body>
</html>
