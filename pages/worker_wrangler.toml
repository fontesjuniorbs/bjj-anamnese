name = "bjj-anamnese-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace para anamneses
# Substituir o id pelo Namespace ID real após criar no painel Cloudflare
[[kv_namespaces]]
binding = "ANAMNESES"
id = "SUBSTITUIR_PELO_KV_ID_REAL"

# Variáveis de ambiente
# AUTH_TOKEN deve ser configurado via dashboard (Settings > Variables)
# para não expor o token no repositório.
#
# Exemplo:
#   wrangler secret put AUTH_TOKEN
#
[vars]
ALLOWED_ORIGINS = "https://bjj-anamnese.pages.dev,file://,http://localhost,http://localhost:8080"
PAGES_HOST = "bjj-anamnese.pages.dev"
PUBLIC_BASE_URL = "https://bjj-anamnese.pages.dev"
NOTIFY_PROFESSIONAL_NAME = "Prof. Esp. Fontes Júnior"

# ─── SECRETS (configurar via dashboard ou wrangler secret put) ───
#
# Obrigatório:
#   wrangler secret put AUTH_TOKEN
#     → token UUID hex de 64 chars usado pelo painel admin
#
# Notificações (opcionais, cada um pode ser ativado independentemente):
#
#   wrangler secret put NOTIFY_EMAIL_TO
#     → e-mail destinatário das notificações (ex: junior@bodysize.com.br)
#   wrangler secret put NOTIFY_EMAIL_FROM
#     → e-mail remetente do domínio configurado no MailChannels
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#     → token do bot criado no @BotFather (formato 123456:ABC-DEF...)
#   wrangler secret put TELEGRAM_CHAT_ID
#     → chat_id obtido em https://api.telegram.org/bot<TOKEN>/getUpdates
#
#   wrangler secret put SHEETS_WEBHOOK_URL
#     → URL pública do Apps Script web app (ver docs/FASE_4_NOTIFICACOES.md)
#
# Se uma variável de notificação NÃO estiver configurada, o canal correspondente
# é silenciosamente ignorado. As outras continuam funcionando normalmente.

# Limites e observabilidade
[observability]
enabled = true

# Para deploy via dashboard: não precisa fazer nada aqui
# Para deploy via CLI:
#   cd worker
#   wrangler deploy
